name: Go CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'aegis-control/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'aegis-control/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      working-directory: ./aegis-control
      run: go build -v ./...

    - name: Test
      working-directory: ./aegis-control
      run: go test -v ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: ./aegis-control
